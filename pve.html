<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>妖王对战 V0.1 人机验证</title>
<style>
body{margin:0;background:#15100b;color:#f7ead0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:14px 16px;background:#21170f;border-bottom:1px solid #4a3622}main{display:grid;grid-template-columns:1fr 360px 1fr;gap:12px;padding:12px}.box{background:#241b13;border:1px solid #4a3622;border-radius:14px;padding:12px}.active{box-shadow:0 0 0 2px #d8a640 inset}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stat{background:#130d08;border:1px solid #4a3622;border-radius:999px;padding:5px 9px;font-size:13px}.zone{display:flex;gap:8px;flex-wrap:wrap;min-height:78px;background:#130d08;border:1px dashed #4a3622;border-radius:10px;padding:8px}.card{width:100px;min-height:126px;background:#f3dfb5;color:#2b1608;border:2px solid #8b5c23;border-radius:10px;padding:7px;font-size:12px}.card b{font-size:15px}.sel{outline:3px solid #4a8fcf}.new{opacity:.55}.log{height:330px;overflow:auto;background:#110c08;border:1px solid #3e2a19;border-radius:10px;padding:8px;font-size:12px}.log div{border-bottom:1px solid #2b1d12;padding:3px 0}button,select{background:#3b2a19;color:#ffe8ba;border:1px solid #7d5a2d;border-radius:9px;padding:8px 10px}button{cursor:pointer}.primary{background:#7a4d17;border-color:#e0a941}.danger{background:#653028;border-color:#c65b4d}.hint{font-size:12px;color:#bca37a;line-height:1.5}@media(max-width:900px){main{grid-template-columns:1fr}.mid{order:-1}}
</style>
</head>
<body>
<header><h1>妖王对战 V0.1 人机验证</h1><div class="hint">已加入召唤延迟：打出的当回合不能普通攻击；大鹏精技能攻击例外。</div></header>
<main>
<section class="box" id="humanBox"><h2>你</h2><div class="row" id="s0"></div><h3>场上</h3><div class="zone" id="b0"></div><h3>手牌</h3><div class="zone" id="h0"></div></section>
<section class="box mid"><h2>控制</h2><div class="row"><label>生命 <select id="life"><option>12</option><option>24</option></select></label><button class="primary" onclick="start()">开始</button><button onclick="begin()">开始你的回合</button><button onclick="endHuman()">结束并让AI行动</button><button class="danger" onclick="location.reload()">重开</button></div><p class="hint">操作：点手牌打出；点己方可攻击妖怪，再点敌方妖怪攻击。敌方无妖怪时，点己方妖怪直攻。灰色卡表示本回合刚打出，不能普通攻击。</p><div id="result"></div><h3>日志</h3><div class="log" id="log"></div></section>
<section class="box" id="aiBox"><h2>AI</h2><div class="row" id="s1"></div><h3>场上</h3><div class="zone" id="b1"></div><h3>手牌</h3><div class="zone" id="h1"></div></section>
</main>
<script>
const base=[['小钻风',1],['小钻风',1],['有来有去',1],['有来有去',1],['精细鬼',1],['精细鬼',1],['急如火',1],['急如火',1],['快如风',1],['快如风',1],['云里雾',2],['云里雾',2],['雾里云',2],['雾里云',2],['金角大王',3],['金角大王',3],['银角大王',3],['银角大王',3],['白骨精',3],['白骨精',3],['铁扇公主',3],['铁扇公主',3],['红孩儿',4],['红孩儿',4],['黄风怪',4],['黄风怪',4],['青狮精',4],['青狮精',4],['牛魔王',5],['大鹏精',5]].map((x,i)=>({n:x[0],s:x[1],id:i}));
let G=null, chosen=null;
const $=id=>document.getElementById(id);function sh(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function lg(t){let d=document.createElement('div');d.textContent=t;$('log').prepend(d)}function make(c,o){return{...c,o,uid:o+'-'+c.id+'-'+Math.random(),d:0,old:false,atk:false}}function player(name,o,l){return{name,o,life:l,deck:sh(base.map(c=>make(c,o))),hand:[],board:[],discard:[],energy:0,turn:0}}function draw(p,n=1){for(let i=0;i<n;i++){if(p.deck.length)p.hand.push(p.deck.shift());else{p.life--;lg(p.name+'抽空，失去1点生命')}}}function start(){let l=Number($('life').value);G={p:[player('你',0,l),player('AI',1,l)],cur:0,win:null};draw(G.p[0],5);draw(G.p[1],5);lg('开始。点击“开始你的回合”。');ren()}function cur(){return G.p[G.cur]}function foe(){return G.p[1-G.cur]}function begin(){if(!G||G.win||G.cur!==0)return;let p=cur();p.turn++;p.energy=Math.min(p.turn,5);p.board.forEach(c=>{c.atk=false;c.old=true;c.d=0});if(p.turn>1)draw(p,1);lg('你的回合，妖气 '+p.energy);ren()}function endHuman(){if(!G||G.win)return;G.p[0].energy=0;G.cur=1;aiTurn();G.cur=0;ren()}function remove(c){let p=G.p[c.o],i=p.board.indexOf(c);if(i>=0)return p.board.splice(i,1)[0]}function out(c){let p=G.p[c.o],x=remove(c);if(!x)return;if(x.n==='白骨精'){x.d=0;x.old=false;x.atk=false;p.deck.push(x);sh(p.deck)}else p.discard.push(x)}function back(c){let p=G.p[c.o],x=remove(c);if(x){x.d=0;x.old=false;x.atk=false;p.hand.push(x)}}function skill(c){let p=G.p[c.o],e=G.p[1-c.o];if(c.n==='有来有去'){draw(p,1);p.hand.sort((a,b)=>a.s-b.s);p.discard.push(p.hand.shift())}if(c.n==='急如火'){draw(p,1);draw(e,1)}if(c.n==='云里雾')sh(e.deck);if(c.n==='雾里云')sh(p.deck);if(c.n==='铁扇公主'&&e.board.length)back(e.board.slice().sort((a,b)=>b.s-a.s)[0]);if(c.n==='红孩儿')G.p[0].board.concat(G.p[1].board).filter(x=>x.s===1).forEach(out);if(c.n==='黄风怪')e.board.filter(x=>x.s<3).slice(0,2).forEach(back);if(c.n==='青狮精'){let t=e.board.filter(x=>x.s<=4).sort((a,b)=>b.s-a.s)[0];if(t)out(t)}if(c.n==='大鹏精'){c.old=true;hit(c,bestTarget(c))}}function play(i){let p=G.p[0],c=p.hand[i];if(G.cur!==0||p.energy<c.s)return alert('不能打出');p.energy-=c.s;p.hand.splice(i,1);c.old=false;p.board.push(c);lg('你打出 '+c.n);skill(c);check();ren()}function bestTarget(a){let e=G.p[1-a.o];if(!e.board.length)return null;return e.board.filter(x=>x.s-x.d<=a.s).sort((x,y)=>(x.s-x.d)-(y.s-y.d))[0]||e.board.slice().sort((x,y)=>x.s-y.s)[0]}function hit(a,t){let e=G.p[1-a.o];if(!a||a.atk||!a.old)return;if(!t){e.life-=a.s;a.atk=true;lg(a.n+'直攻 '+a.s);check();return}a.d+=t.s;t.d+=a.s;a.atk=true;lg(a.n+'攻击'+t.n);if(t.d>=t.s)out(t);if(a.d>=a.s)out(a);check()}function clickB(o,i){let c=G.p[o].board[i];if(G.cur!==0||G.win)return;if(o===0){chosen=c;ren();return}if(chosen)hit(chosen,c);chosen=null;ren()}function check(){G.p.forEach(p=>{if(p.life<=0&&!G.win){G.win=G.p[1-p.o];$('result').innerHTML='<h2>'+G.win.name+'获胜</h2>';lg(G.win.name+'获胜')}})}function aiTurn(){let p=G.p[1];p.turn++;p.energy=Math.min(p.turn,5);p.board.forEach(c=>{c.atk=false;c.old=true;c.d=0});draw(p,1);let guard=0;while(guard++<20){let c=p.hand.filter(x=>x.s<=p.energy).sort((a,b)=>b.s-a.s)[0];if(!c)break;p.energy-=c.s;p.hand.splice(p.hand.indexOf(c),1);c.old=false;p.board.push(c);lg('AI打出 '+c.n);skill(c);if(G.win)return}p.board.slice().filter(c=>c.old&&!c.atk).sort((a,b)=>a.s-b.s).forEach(c=>hit(c,bestTarget(c)));p.energy=0}function card(c,o,i,hand){let cls='card '+(!c.old&&!hand?'new ':'')+(chosen===c?'sel':'');return '<div class="'+cls+'" onclick="'+(hand?'play('+i+')':'clickB('+o+','+i+')')+'"><b>'+c.n+'</b>'+c.s+'星<br>伤害 '+c.d+(c.atk?'<br>已攻':'')+'</div>'}function ren(){if(!G)return;[0,1].forEach(i=>{let p=G.p[i];$('s'+i).innerHTML='<span class="stat">生命 '+p.life+'</span><span class="stat">妖气 '+p.energy+'</span><span class="stat">牌组 '+p.deck.length+'</span><span class="stat">手牌 '+p.hand.length+'</span>';$('b'+i).innerHTML=p.board.map((c,k)=>card(c,i,k,false)).join('');$('h'+i).innerHTML=p.hand.map((c,k)=>i===0?card(c,i,k,true):'<div class="card"><b>手牌</b></div>').join('')});$('humanBox').classList.toggle('active',G.cur===0);$('aiBox').classList.toggle('active',G.cur===1)}
</script>
</body>
</html>
