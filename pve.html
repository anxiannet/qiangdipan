<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>妖王对战 V0.1 人机</title>
<link rel="stylesheet" href="./static/pve.css">
</head>
<body>
<div class="loading" id="loading">读取 data/cards.v1.json 与 data/duel.v01.json 中……</div>
<div class="game">
  <div class="top">
    <div>
      <h1>妖王对战 V0.1</h1>
      <div class="sub">统一数据版：卡牌来自 cards.v1.json；对战配置来自 duel.v01.json。</div>
    </div>
    <div>
      <select id="life"><option value="12">12生命</option><option value="24">24生命</option></select>
      <button class="primary" onclick="startGame()">开始/重开</button>
      <button onclick="endTurn()">结束回合</button>
    </div>
  </div>
  <div class="table">
    <div class="side left">
      <div class="avatar"><b>你</b><div id="p0s"></div></div>
      <button onclick="hint()">AI建议</button>
      <button class="danger" onclick="location.href='./'">返回大厅</button>
      <div class="phase" id="phase">未开始</div>
      <div class="result" id="result"></div>
    </div>
    <div class="side right">
      <div class="avatar"><b>AI</b><div id="p1s"></div></div>
      <div class="log" id="log"></div>
    </div>
    <div class="arena"><div class="zone enemy" id="b1"></div></div>
    <div class="arena"><div class="centerMark">抢地盘</div></div>
    <div class="arena"><div class="zone" id="b0"></div></div>
  </div>
  <div class="hand" id="hand"></div>
</div>
<script src="./static/pve.js"></script>
</body>
</html>
