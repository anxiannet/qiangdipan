<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>妖王对战 V0.1 AI自动验证</title>
<style>
body{margin:0;background:#15100b;color:#f7ead0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:16px;background:#21170f;border-bottom:1px solid #4a3622}main{padding:14px;display:grid;gap:12px;grid-template-columns:1fr 1fr}.panel{background:#241b13;border:1px solid #4a3622;border-radius:14px;padding:14px}.wide{grid-column:1/3}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select,input{background:#3b2a19;color:#ffe8ba;border:1px solid #7d5a2d;border-radius:9px;padding:8px 10px}button{cursor:pointer}.primary{background:#7a4d17;border-color:#e0a941}.muted{color:#bca37a;font-size:13px;line-height:1.5}.stat{display:inline-block;background:#130d08;border:1px solid #4a3622;border-radius:999px;padding:5px 9px;margin:3px}.board{display:flex;gap:6px;flex-wrap:wrap;min-height:70px;background:#130d08;border:1px dashed #4a3622;border-radius:10px;padding:8px}.card{background:#f3dfb5;color:#2b1608;border:2px solid #8b5c23;border-radius:10px;width:92px;min-height:96px;padding:6px;font-size:12px}.card b{display:block;font-size:14px}.log{height:320px;overflow:auto;background:#110c08;border:1px solid #3e2a19;border-radius:10px;padding:8px;font-size:12px}.log div{border-bottom:1px solid #2b1d12;padding:3px 0}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{border:1px solid #4a3622;padding:7px;text-align:left}th{background:#17100a;color:#ffdc90}@media(max-width:800px){main{grid-template-columns:1fr}.wide{grid-column:1}}
</style>
</head>
<body>
<header><h1>妖王对战 V0.1 AI自动验证</h1><div class="muted">用于批量跑局：检查12/24生命、铺场速度、回合长度、胜率偏差、最大场面数量。</div></header>
<main>
<section class="panel wide">
<h2>控制台</h2>
<div class="row">
<label>生命 <select id="life"><option value="12">12点</option><option value="24">24点</option></select></label>
<label>局数 <input id="games" type="number" min="1" max="5000" value="200" /></label>
<label>牛魔王 <select id="cow"><option value="energy">按剩余妖气</option><option value="free">免费再打一张</option></select></label>
<button class="primary" id="one">AI打一局</button>
<button class="primary" id="batch">批量验证</button>
<button id="clear">清空日志</button>
</div>
<div class="muted">AI策略：优先打出最高星可支付妖怪；技能优先影响对方；攻击优先尝试击杀，否则攻击低星目标；无妖怪阻挡时直攻。</div>
<div id="summary"></div>
</section>
<section class="panel"><h2>AI一</h2><div id="p0stats"></div><h3>场上</h3><div class="board" id="p0board"></div><h3>手牌</h3><div class="board" id="p0hand"></div></section>
<section class="panel"><h2>AI二</h2><div id="p1stats"></div><h3>场上</h3><div class="board" id="p1board"></div><h3>手牌</h3><div class="board" id="p1hand"></div></section>
<section class="panel wide"><h2>日志</h2><div class="log" id="log"></div></section>
</main>
<script>
const base=[['小钻风',1],['小钻风',1],['有来有去',1],['有来有去',1],['精细鬼',1],['精细鬼',1],['伶俐虫',1],['伶俐虫',1],['急如火',1],['急如火',1],['快如风',1],['快如风',1],['云里雾',2],['云里雾',2],['雾里云',2],['雾里云',2],['金角大王',3],['金角大王',3],['银角大王',3],['银角大王',3],['白骨精',3],['白骨精',3],['铁扇公主',3],['铁扇公主',3],['红孩儿',4],['红孩儿',4],['黄风怪',4],['黄风怪',4],['青狮精',4],['青狮精',4],['牛魔王',5],['大鹏精',5]].slice(0,30).map((x,i)=>({name:x[0],star:x[1],id:i}));
let G=null; let logs=[]; let quiet=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function log(s){logs.unshift(s); if(!quiet){const d=document.createElement('div');d.textContent=s;document.getElementById('log').prepend(d)}}
function card(c,owner){return {name:c.name,star:c.star,id:c.id,owner,uid:owner+'-'+c.id+'-'+Math.random(),dmg:0,attacked:false}}
function player(name,idx,life){return {name,idx,life,maxLife:life,deck:shuffle(base.map(c=>card(c,idx))),hand:[],board:[],discard:[],energy:0,turns:0,maxBoard:0}}
function newGame(life){logs=[];G={p:[player('AI一',0,life),player('AI二',1,life)],cur:0,winner:null,reason:'',turns:0,maxBoard:0};draw(G.p[0],5);draw(G.p[1],5)}
function draw(p,n){for(let i=0;i<n;i++){if(p.deck.length===0){p.life--;check('抽空');log(p.name+'牌组为空，失去1点生命')}else p.hand.push(p.deck.shift())}}
function cur(){return G.p[G.cur]}function opp(){return G.p[1-G.cur]}function all(){return G.p[0].board.concat(G.p[1].board)}
function check(reason){G.p.forEach(p=>{if(p.life<=0&&!G.winner){G.winner=G.p[1-p.idx];G.reason=reason}})}
function remove(c){const p=G.p[c.owner];const i=p.board.indexOf(c);if(i>=0)return p.board.splice(i,1)[0]}
function destroy(c){const p=G.p[c.owner];const x=remove(c);if(!x)return;if(x.name==='白骨精'){x.dmg=0;x.attacked=false;p.deck.push(x);shuffle(p.deck)}else p.discard.push(x)}
function bounce(c){const p=G.p[c.owner];const x=remove(c);if(x){x.dmg=0;x.attacked=false;p.hand.push(x)}}
function discardWorst(p){if(!p.hand.length)return;p.hand.sort((a,b)=>a.star-b.star);p.discard.push(p.hand.shift())}
function bestPlayable(p){return p.hand.filter(c=>c.star<=p.energy).sort((a,b)=>b.star-a.star)[0]}
function bestAny(p){return p.hand.slice().sort((a,b)=>b.star-a.star)[0]}
function play(p,c,free){const i=p.hand.indexOf(c);if(i<0)return false;if(!free&&p.energy<c.star)return false;if(!free)p.energy-=c.star;p.hand.splice(i,1);p.board.push(c);p.maxBoard=Math.max(p.maxBoard,p.board.length);G.maxBoard=Math.max(G.maxBoard,all().length);skill(c);return true}
function topBottom(p){if(p.deck.length)p.deck.push(p.deck.shift())}
function skill(c){const p=G.p[c.owner],o=G.p[1-c.owner];switch(c.name){case'小钻风':if(o.deck[0]&&o.deck[0].star>=3)topBottom(o);break;case'精细鬼':if(p.deck[0]&&p.deck[0].star<=1)topBottom(p);break;case'有来有去':draw(p,1);discardWorst(p);break;case'急如火':draw(p,1);draw(o,1);break;case'快如风':topBottom(o);break;case'云里雾':shuffle(o.deck);break;case'雾里云':shuffle(p.deck);break;case'金角大王':if(o.deck[0]&&o.deck[0].star>=3)topBottom(o);break;case'银角大王':{let t=p.deck.splice(0,3).sort((a,b)=>b.star-a.star);p.deck.unshift(...t);break}case'铁扇公主':{let t=o.board.slice().sort((a,b)=>b.star-a.star)[0];if(t)bounce(t);break}case'红孩儿':all().filter(x=>x.star===1).forEach(destroy);break;case'黄风怪':o.board.filter(x=>x.star<3).sort((a,b)=>b.star-a.star).slice(0,2).forEach(bounce);break;case'青狮精':{let t=o.board.filter(x=>x.star<=4).sort((a,b)=>b.star-a.star)[0];if(t)destroy(t);break}case'牛魔王':if(document.getElementById('cow').value==='free'){let n=bestAny(p);if(n)play(p,n,true)}break;case'大鹏精':attackWith(c);break}}
function attack(a,d){if(!a||a.attacked||G.winner)return;if(!d){G.p[1-a.owner].life-=a.star;a.attacked=true;check('直攻');return}a.dmg+=d.star;d.dmg+=a.star;a.attacked=true;if(d.dmg>=d.star)destroy(d);if(a.dmg>=a.star)destroy(a);check('战斗')}
function attackWith(a){const o=G.p[1-a.owner];if(!o.board.length){attack(a,null);return}let kill=o.board.filter(d=>d.star-d.dmg<=a.star).sort((x,y)=>(x.star-x.dmg)-(y.star-y.dmg))[0];attack(a,kill||o.board.slice().sort((x,y)=>x.star-y.star)[0])}
function turn(){const p=cur();p.turns++;G.turns++;p.energy=Math.min(p.turns,5);p.board.forEach(c=>{c.attacked=false;c.dmg=0});if(!(p.idx===0&&p.turns===1))draw(p,1);let guard=0;while(!G.winner&&guard++<50){let c=bestPlayable(p);if(!c)break;play(p,c,false)}p.board.slice().filter(c=>!c.attacked).sort((a,b)=>a.star-b.star).forEach(attackWith);p.board.forEach(c=>c.dmg=0);p.energy=0;G.cur=1-G.cur;if(G.turns>200&&!G.winner){G.reason='200回合未分胜负';G.winner=null;return false}return !G.winner}
function runOne(show){quiet=!show;newGame(Number(document.getElementById('life').value));let safety=0;while(!G.winner&&safety++<200)turn();quiet=false;if(show){render();oneSummary(G);log((G.winner?G.winner.name+'获胜':'未分胜负')+'，回合 '+G.turns+'，最大场面 '+G.maxBoard)}return {winner:G.winner?G.winner.idx:null,turns:G.turns,maxBoard:G.maxBoard,p0:G.p[0].life,p1:G.p[1].life,reason:G.reason}}
function batch(){const n=Math.max(1,Math.min(5000,Number(document.getElementById('games').value)||200));const rows=[];for(let i=0;i<n;i++)rows.push(runOne(false));const w0=rows.filter(r=>r.winner===0).length,w1=rows.filter(r=>r.winner===1).length,dr=rows.filter(r=>r.winner===null).length;const avg=k=>Math.round(rows.reduce((s,r)=>s+r[k],0)/n*10)/10;document.getElementById('summary').innerHTML='<table><tr><th>局数</th><th>AI一胜</th><th>AI二胜</th><th>未分胜负</th><th>平均回合</th><th>最大场面均值</th></tr><tr><td>'+n+'</td><td>'+w0+'</td><td>'+w1+'</td><td>'+dr+'</td><td>'+avg('turns')+'</td><td>'+avg('maxBoard')+'</td></tr></table>';document.getElementById('log').innerHTML='';rows.slice(0,30).forEach((r,i)=>log('样本'+(i+1)+'：'+(r.winner===null?'未分胜负':'AI'+(r.winner+1)+'胜')+'，'+r.turns+'回合，最大场面'+r.maxBoard))}
function oneSummary(g){document.getElementById('summary').innerHTML='<table><tr><th>结果</th><th>回合</th><th>最大场面</th><th>剩余生命</th></tr><tr><td>'+(g.winner?g.winner.name+'胜':'未分胜负')+'</td><td>'+g.turns+'</td><td>'+g.maxBoard+'</td><td>AI一 '+g.p[0].life+' / AI二 '+g.p[1].life+'</td></tr></table>'}
function htmlCard(c){return '<div class="card"><b>'+c.name+'</b>'+c.star+'星<br>伤害 '+c.dmg+(c.attacked?'<br>已攻':'')+'</div>'}
function render(){if(!G)return;[0,1].forEach(i=>{const p=G.p[i];document.getElementById('p'+i+'stats').innerHTML='<span class="stat">生命 '+p.life+'/'+p.maxLife+'</span><span class="stat">牌组 '+p.deck.length+'</span><span class="stat">手牌 '+p.hand.length+'</span><span class="stat">弃牌 '+p.discard.length+'</span>';document.getElementById('p'+i+'board').innerHTML=p.board.map(htmlCard).join('');document.getElementById('p'+i+'hand').innerHTML=p.hand.map(c=>'<div class="card"><b>'+c.name+'</b>'+c.star+'星</div>').join('')})}
document.getElementById('one').addEventListener('click',()=>runOne(true));document.getElementById('batch').addEventListener('click',batch);document.getElementById('clear').addEventListener('click',()=>{document.getElementById('log').innerHTML='';document.getElementById('summary').innerHTML=''});
</script>
</body>
</html>
