name: Bootstrap Qiangdipan Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Migrate project files from anxiannet/xiyao
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .migration-complete ]; then
            echo "Migration already completed."
            exit 0
          fi

          rm -rf /tmp/xiyao
          git clone --depth 1 https://github.com/anxiannet/xiyao.git /tmp/xiyao

          SRC_GAME="/tmp/xiyao/游戏/卡牌游戏/占山为王"
          SRC_VISUAL="/tmp/xiyao/视觉设计/占山为王"

          mkdir -p 规则 视觉 卡牌成品 开发 归档/规则归档

          if [ -d "$SRC_GAME" ]; then
            find "$SRC_GAME" -maxdepth 1 -type f -name "*.md" -print0 | while IFS= read -r -d '' f; do
              cp "$f" "规则/$(basename "$f")"
            done

            if [ -f "规则/当前项目记忆-2026-06-23.md" ]; then
              mv "规则/当前项目记忆-2026-06-23.md" "当前项目记忆.md"
            fi

            if [ -f "规则/README.md" ]; then
              mv "规则/README.md" "归档/旧版README-占山为王.md"
            fi

            if [ -d "$SRC_GAME/开发" ]; then
              cp -a "$SRC_GAME/开发/." 开发/
            fi

            if [ -d "$SRC_GAME/归档" ]; then
              cp -a "$SRC_GAME/归档/." 归档/规则归档/
            fi
          fi

          if [ -d "$SRC_VISUAL" ]; then
            cp -a "$SRC_VISUAL/." 视觉/

            if [ -d "视觉/成品卡牌" ]; then
              cp -a "视觉/成品卡牌/." 卡牌成品/
              rm -rf "视觉/成品卡牌"
            fi
          fi

          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              ("《夕妖：占山为王》", "《夕妖：抢地盘》"),
              ("夕妖：占山为王", "夕妖：抢地盘"),
              ("占山为王", "抢地盘"),
              ("xiyao_zhanshanweiwang", "xiyao_qiangdipan"),
              ("xiyao-zhanshanweiwang", "qiangdipan"),
              ("视觉设计/抢地盘/", "视觉/"),
              ("视觉设计/抢地盘", "视觉"),
              ("游戏/卡牌游戏/抢地盘/", "规则/"),
              ("游戏/卡牌游戏/抢地盘", "规则"),
          ]

          allowed_suffixes = {'.md', '.json', '.py', '.txt'}
          for path in Path('.').rglob('*'):
              if not path.is_file():
                  continue
              if '.git' in path.parts or '.github' in path.parts:
                  continue
              if path.suffix.lower() not in allowed_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

          cat > README.md <<'EOF'
          # 《夕妖：抢地盘》

          西游妖怪题材欢乐聚会卡牌游戏。

          2~4 人｜15~30 分钟｜轻策略｜轻 TRPG 代入｜实体印刷优先

          ## 当前定位

          本仓库是《夕妖：抢地盘》的独立项目库，用于集中维护规则、卡表、技能文案、视觉规范、UI资产、AI工作流与成品卡牌资料。

          ## 当前版本

          规则版本：V1.2

          核心胜利条件：控制同一阵营 3 块地盘，立即获胜

          ## 仓库结构

          ```text
          qiangdipan/
          ├── README.md
          ├── 当前项目记忆.md
          ├── 规则/
          ├── 视觉/
          ├── 卡牌成品/
          ├── 开发/
          └── 归档/
          ```

          ## 唯一来源原则

          | 内容 | 唯一来源 |
          |---|---|
          | 当前规则 | `规则/` |
          | 基础卡表 | `规则/V1.2-基础卡表.md` |
          | 卡面技能文案 | `规则/V1.2-卡面技能文案.md` |
          | 实体说明书 | `规则/游戏手册.md` |
          | 视觉方向 | `视觉/视觉总规范.md` |
          | UI 与卡背系统 | `视觉/UI修订说明-地盘横置方案.md` |
          | UI 透明资产 | `视觉/UI资产规范.md` |
          | 成品卡牌 | `卡牌成品/` |

          ## 世界观边界

          本仓库不重复维护《夕妖》世界观和人物志。人物事实、世界观设定、阵营根设定仍以总仓库 `anxiannet/xiyao/世界观/` 为准。
          EOF

          cat > 迁移说明.md <<'EOF'
          # 迁移说明

          本仓库由 `anxiannet/xiyao` 中原《占山为王》相关内容整理而来。

          项目更名：占山为王 → 抢地盘

          已执行动作：

          - 将规则文件集中到 `规则/`
          - 将视觉规范集中到 `视觉/`
          - 将成品卡牌资料移动到 `卡牌成品/`
          - 将开发评估文件移动到 `开发/`
          - 将旧版与过期资料移动到 `归档/`
          EOF

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .migration-complete

          git checkout -- .github/workflows/bootstrap-migration.yml
          git rm -f .migration-trigger 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "迁移抢地盘项目文档与视觉资料"
          git push
