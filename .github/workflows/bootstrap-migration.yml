name: Bootstrap Qiangdipan Migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Migrate project files from anxiannet/xiyao
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .migration-complete ]; then
            echo "Migration already completed."
            exit 0
          fi

          git clone --depth 1 https://github.com/anxiannet/xiyao.git /tmp/xiyao

          SRC_GAME="/tmp/xiyao/游戏/卡牌游戏/占山为王"
          SRC_VISUAL="/tmp/xiyao/视觉设计/占山为王"

          mkdir -p 规则 视觉 卡牌成品 开发 归档/规则归档

          # 规则与项目文档
          if [ -d "$SRC_GAME" ]; then
            find "$SRC_GAME" -maxdepth 1 -type f -name "*.md" -print0 | while IFS= read -r -d '' f; do
              cp "$f" "规则/$(basename "$f")"
            done

            if [ -f "规则/当前项目记忆-2026-06-23.md" ]; then
              mv "规则/当前项目记忆-2026-06-23.md" "当前项目记忆.md"
            fi

            if [ -f "规则/README.md" ]; then
              mv "规则/README.md" "归档/旧版README-妖王大会.md"
            fi

            if [ -d "$SRC_GAME/开发" ]; then
              cp -a "$SRC_GAME/开发/." 开发/
            fi

            if [ -d "$SRC_GAME/归档" ]; then
              cp -a "$SRC_GAME/归档/." 归档/规则归档/
            fi
          fi

          # 视觉规范与资产
          if [ -d "$SRC_VISUAL" ]; then
            cp -a "$SRC_VISUAL/." 视觉/

            if [ -d "视觉/成品卡牌" ]; then
              cp -a "视觉/成品卡牌/." 卡牌成品/
              rm -rf "视觉/成品卡牌"
            fi
          fi

          # 项目更名与路径修正
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              ("《夕妖：占山为王》", "《夕妖：抢地盘》"),
              ("夕妖：占山为王", "夕妖：抢地盘"),
              ("占山为王", "抢地盘"),
              ("妖王大会", "抢地盘旧版概念"),
              ("xiyao_zhanshanweiwang", "xiyao_qiangdipan"),
              ("xiyao-zhanshanweiwang", "qiangdipan"),
              ("视觉设计/抢地盘/", "视觉/"),
              ("视觉设计/抢地盘", "视觉"),
              ("游戏/卡牌游戏/抢地盘/", "规则/"),
              ("游戏/卡牌游戏/抢地盘", "规则"),
          ]

          for path in Path('.').rglob('*'):
              if not path.is_file():
                  continue
              if '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.md', '.json', '.py', '.yml', '.yaml', '.txt'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

          cat > README.md <<'EOF'
          # 《夕妖：抢地盘》

          西游妖怪题材欢乐聚会卡牌游戏。

          2~4 人｜15~30 分钟｜轻策略｜轻 TRPG 代入｜实体印刷优先

          ---

          ## 当前定位

          本仓库是《夕妖：抢地盘》的独立项目库，用于集中维护：

          - 游戏规则
          - 基础卡表
          - 卡面技能文案
          - 实体印刷游戏手册
          - 视觉规范
          - UI 与卡牌边框规范
          - AI 生成工作流
          - 成品卡牌与导出资料

          原始内容来自总仓库：

          ```text
          https://github.com/anxiannet/xiyao
          ```

          原目录：

          ```text
          游戏/卡牌游戏/占山为王/
          视觉设计/占山为王/
          ```

          项目已更名：

          ```text
          占山为王 → 抢地盘
          ```

          ---

          ## 当前版本

          规则版本：V1.2

          当前基础牌库：

          - 24 张 1 星小妖
          - 12 张 2 星精英
          - 12 张 3 星首领
          - 4 张法宝
          - 12 张地盘

          核心胜利条件：

          ```text
          控制同一阵营 3 块地盘，立即获胜
          ```

          ---

          ## 仓库结构

          ```text
          qiangdipan/
          ├── README.md
          ├── 当前项目记忆.md
          ├── 规则/
          ├── 视觉/
          ├── 卡牌成品/
          ├── 开发/
          └── 归档/
          ```

          ---

          ## 唯一来源原则

          | 内容 | 唯一来源 |
          |---|---|
          | 当前规则 | `规则/` |
          | 基础卡表 | `规则/V1.2-基础卡表.md` |
          | 卡面技能文案 | `规则/V1.2-卡面技能文案.md` |
          | 实体说明书 | `规则/游戏手册.md` |
          | 视觉方向 | `视觉/视觉总规范.md` |
          | UI 与卡背系统 | `视觉/UI修订说明-地盘横置方案.md` |
          | UI 透明资产 | `视觉/UI资产规范.md` |
          | 成品卡牌 | `卡牌成品/` |

          禁止在多个文件中重复维护同一规则、同一卡表、同一技能文案。

          ---

          ## 推荐读取顺序

          1. `当前项目记忆.md`
          2. `规则/V1.0-核心规则重构.md`
          3. `规则/V1.2-基础卡表.md`
          4. `规则/V1.2-卡面技能文案.md`
          5. `规则/游戏手册.md`
          6. `视觉/当前状态.md`
          7. `视觉/UI修订说明-地盘横置方案.md`
          8. `视觉/UI资产规范.md`
          9. `视觉/视觉总规范.md`

          ---

          ## 世界观边界

          本仓库不重复维护《夕妖》世界观和人物志。

          人物事实、世界观设定、阵营根设定仍以总仓库中的唯一来源为准：

          ```text
          anxiannet/xiyao/世界观/
          ```

          本仓库只维护《抢地盘》作为实体卡牌项目所需的规则、卡牌、视觉与生产资料。
          EOF

          cat > 迁移说明.md <<'EOF'
          # 迁移说明

          本仓库由 `anxiannet/xiyao` 中《占山为王》相关内容整理而来。

          ## 已执行动作

          - 将项目名从《占山为王》统一更名为《抢地盘》
          - 将规则文件集中到 `规则/`
          - 将视觉规范集中到 `视觉/`
          - 将成品卡牌资料移动到 `卡牌成品/`
          - 将开发评估文件移动到 `开发/`
          - 将旧版与过期资料移动到 `归档/`
          - 新增独立项目 README

          ## 迁移原则

          - 不改核心规则含义
          - 不改卡牌数值
          - 不重写人物设定
          - 不创建平行世界观
          - GitHub 当前版本优先
          EOF

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .migration-complete

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "迁移抢地盘项目文档与视觉资料"
          git push
