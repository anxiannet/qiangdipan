name: Cleanup migrated Realm Ruckus source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-realmruckus-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop if cleanup is complete
        id: guard
        run: |
          if [ -f .realmruckus-source-cleanup-complete ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace migrated directory with index
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -e
          rm -rf '皮肤主题/Realm Ruckus'
          mkdir -p '皮肤主题/Realm Ruckus'
          cat > '皮肤主题/Realm Ruckus/README.md' <<'EOF'
          # Realm Ruckus 迁移索引

          迁移日期：2026-07-14  
          状态：已迁移至独立仓库

          ## 新仓库

          ```text
          https://github.com/anxiannet/realmruckus
          ```

          Realm Ruckus 的主题文档、英文规则、卡表、视觉规范、包装规范、品牌资料和视觉锚点，迁移后统一在独立仓库维护。

          ## 新仓库结构

          ```text
          anxiannet/realmruckus
          ├── README.md
          ├── index.html
          ├── public/
          │   └── assets/
          └── 文档/
          ```

          ## 原项目保留职责

          本仓库继续作为共享机制与原版项目的唯一来源，保留：

          - `当前项目记忆.md`
          - `规则/V1.3-核心规则.md`
          - `规则/V1.3-基础卡表.md`
          - `规范流程/换皮与卡号规范.md`
          - 通用视觉、UI、插画审核与印刷规范

          Realm Ruckus 独立仓库不得反向覆盖本仓库中的共享核心规则。

          ## 关联关系

          ```text
          原项目：anxiannet/qiangdipan
          英文独立项目：anxiannet/realmruckus
          原机制卡号：QDP
          Realm Ruckus卡号前缀：RRK
          跨项目映射：仅在后台与制作资料中维护
          ```

          ## 维护规则

          1. Realm Ruckus 专属内容只在新仓库维护。
          2. 本目录不再保存Realm Ruckus文档或图片副本。
          3. 共享规则发生变化时，先更新本仓库唯一来源，再在新仓库同步派生文件。
          4. 不在两个仓库并行维护两份核心规则。
          EOF
          touch .realmruckus-source-cleanup-complete

      - name: Commit cleanup
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '完成Realm Ruckus迁移并保留原项目索引' || exit 0
          git push
