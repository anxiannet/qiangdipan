name: Duel Territory Comparison

on:
  push:
    paths:
      - '.github/workflows/duel-territory-comparison.yml'
      - '测试代码/**'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile "测试代码/4人基础版AI模拟器.py" 测试代码/qdp_sim/*.py
      - name: Run comparison
        run: |
          set -e
          mkdir -p 测试结果
          for deck in standard fire_cloud; do
            python "测试代码/4人基础版AI模拟器.py" --deck "$deck" --players 2 --domain-count 2 --center-size 2 --ai human_like --games 3000 --seed 20260714 --json > "测试结果/${deck}_2p_6territories_3000.json"
            python "测试代码/4人基础版AI模拟器.py" --deck "$deck" --players 2 --domain-count 3 --center-size 2 --ai human_like --games 3000 --seed 20260714 --json > "测试结果/${deck}_2p_9territories_3000.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: duel-territory-comparison-results
          path: 测试结果/*.json
