name: Simulator Regression Test

on:
  push:
    paths:
      - '测试代码/**'
      - '.github/workflows/simulator-smoke-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile "测试代码/4人基础版AI模拟器.py" 测试代码/qdp_sim/*.py
      - name: Import
        run: |
          cd 测试代码
          python -c "from qdp_sim import Game, run_batch; from qdp_sim.expansion import TunedExpansionGame, build_fire_cloud_deck; assert len(build_fire_cloud_deck()) == 50; print('import ok')"
      - name: Standard regression
        run: |
          set -e
          for p in 2 3 4; do
            for ai in human_like stress_attack; do
              python "测试代码/4人基础版AI模拟器.py" --deck standard --players "$p" --ai "$ai" --games 100 --seed 20260713 --json
            done
          done
      - name: Fire Cloud regression
        run: |
          set -e
          for p in 2 3 4; do
            python "测试代码/4人基础版AI模拟器.py" --deck fire_cloud --players "$p" --ai human_like --games 100 --seed 20260713 --json
          done
      - name: Legacy alias
        run: |
          python "测试代码/4人基础版AI模拟器.py" --players 2 --ai aggressive --games 1 --seed 20260713 --json
